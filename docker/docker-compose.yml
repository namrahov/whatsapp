# Local infrastructure for the whatsapp app: Kafka + Redis. PostgreSQL runs on the host (port 5433).
# Host ports differ from the twitter project (Kafka 9092, Redis 6380) so both stacks can run at once.
# Usage: docker compose -f docker/docker-compose.yml up -d
name: whatsapp

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: whatsapp-kafka
    ports:
      - "9094:9092"
    environment:
      # Single node in KRaft mode: the same process is broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Clients on the host reach the broker through the mapped port.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  redis:
    image: redis:7.4.2
    container_name: whatsapp-redis
    ports:
      - "6381:6379"
    # Redis holds only ephemeral state here (connection registry, Pub/Sub); messages live in PostgreSQL.
    # No persistence: after a restart, clients reconnect and re-register.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  kafka-data:
