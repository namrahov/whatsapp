spring:
  application:
    name: whatsapp
  datasource:
    url: jdbc:postgresql://localhost:5433/whatsapp
    username: postgres
    password: Genius33Frozen
    hikari:
      maximum-pool-size: 10
      # Fail fast when PostgreSQL is down instead of holding the thread for the 30 s default:
      # the client gets a retryable error and resends with the same clientMessageId.
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      # Redis answers in well under a millisecond; a dead Redis must not hold web/WebSocket threads for 60 s.
      timeout: 200ms
      connect-timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      # Wait for all in-sync replicas; idempotence stops broker-side duplicates on producer retries.
      acks: all
      properties:
        enable.idempotence: true
        # send() blocks up to this long when the broker is unreachable (default 60 s).
        max.block.ms: 5000
    consumer:
      # A new consumer group starts from the beginning, so no event published before it existed is skipped.
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8081}

whatsapp:
  registry:
    # Liveness of a connection comes from its gateway's lease (below), not from this TTL. The TTL is only a
    # safety net that removes registry keys of crashed gateways nobody looked at; refreshed every ttl/3.
    ttl: ${REGISTRY_TTL:1h}
    refresh-interval-ms: ${REGISTRY_REFRESH_INTERVAL_MS:1200000}
  gateway:
    # One Redis write per gateway per renew interval, whatever its number of connections. A crashed gateway's
    # connections count as offline once its lease expires: presence lags a crash by up to lease-ttl.
    lease-ttl: ${GATEWAY_LEASE_TTL:30s}
    lease-renew-interval-ms: ${GATEWAY_LEASE_RENEW_INTERVAL_MS:10000}
    # Clients send {"type":"HEARTBEAT"} every ~15 s; tracked in this gateway's memory only (no Redis write).
    # A connection silent for longer is half-open (phone lost network without closing) and is closed.
    idle-timeout: ${GATEWAY_IDLE_TIMEOUT:45s}
    idle-sweep-interval-ms: ${GATEWAY_IDLE_SWEEP_INTERVAL_MS:10000}
  retention:
    # Example policy for the interview: messages are kept 30 days on the server, delivered or not.
    message-ttl: ${RETENTION_MESSAGE_TTL:30d}
    outbox-ttl: ${RETENTION_OUTBOX_TTL:7d}
    batch-size: ${RETENTION_BATCH_SIZE:1000}
    max-batches-per-run: ${RETENTION_MAX_BATCHES_PER_RUN:50}
    interval-ms: ${RETENTION_INTERVAL_MS:600000}
  messages:
    # Product decision: how long after sending the sender may still edit / delete for everyone.
    edit-window: ${MESSAGES_EDIT_WINDOW:15m}
    delete-window: ${MESSAGES_DELETE_WINDOW:48h}
  admission:
    # Reconnect storm protection. Rejected handshakes / syncs get 429 or 503 with a randomised Retry-After.
    handshakes-per-second: ${ADMISSION_HANDSHAKES_PER_SECOND:200}
    max-connections-per-instance: ${ADMISSION_MAX_CONNECTIONS_PER_INSTANCE:10000}
    max-connections-per-user: ${ADMISSION_MAX_CONNECTIONS_PER_USER:5}
    sync-max-concurrent: ${ADMISSION_SYNC_MAX_CONCURRENT:20}
    retry-after-min: ${ADMISSION_RETRY_AFTER_MIN:2s}
    retry-after-max: ${ADMISSION_RETRY_AFTER_MAX:10s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
